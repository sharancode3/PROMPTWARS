services:
  - type: web
    name: lablink-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=server
    startCommand: node server/dist/index.js
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CAMPUS_TIMEZONE
        value: Asia/Kolkata
      - key: DEMO_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
